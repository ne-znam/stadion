<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stadium Overlay</title>
    <meta name="description" content="Compare the world's stadiums with Stadion Maksimir: true-scale footprints of Camp Nou, Allianz Arena, Wembley and more, laid over Dinamo Zagreb's home on satellite imagery." />
    <link rel="canonical" href="https://stadion.nezn.am/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stadium Overlay" />
    <meta property="og:title" content="Stadium Overlay — how big is Camp Nou compared to Maksimir?" />
    <meta property="og:description" content="True-scale footprints of the world's stadiums laid over Stadion Maksimir, Zagreb. Drag, rotate and compare capacity, footprint and pitch size." />
    <meta property="og:url" content="https://stadion.nezn.am/" />
    <meta property="og:image" content="https://stadion.nezn.am/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Camp Nou and Allianz Arena outlines overlaid on Stadion Maksimir on satellite imagery" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stadium Overlay — how big is Camp Nou compared to Maksimir?" />
    <meta name="twitter:description" content="True-scale footprints of the world's stadiums laid over Stadion Maksimir, Zagreb." />
    <meta name="twitter:image" content="https://stadion.nezn.am/og.jpg" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <header>
        <h1>Stadium Overlay</h1>
        <p class="sub">True-scale footprints laid over <strong>Stadion Maksimir</strong>, Zagreb</p>
      </header>

      <section id="reference" class="card ref"></section>

      <section id="active"></section>

      <section class="search">
        <label for="q">Add any stadium or area from OpenStreetMap</label>
        <form id="search-form">
          <input id="q" type="search" placeholder="e.g. Estadio da Luz, Hyde Park…" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
        <ul id="search-results"></ul>
      </section>

      <section class="library">
        <div class="lib-head">
          <h2>Stadiums</h2>
          <select id="sort">
            <option value="area">Sort: footprint</option>
            <option value="capacity">Sort: capacity</option>
            <option value="name">Sort: name</option>
          </select>
        </div>
        <ul id="library"></ul>
      </section>

      <footer>
        <label class="row"><span>Overlay opacity</span><input id="opacity" type="range" min="0.1" max="0.9" step="0.05" value="0.35" /></label>
        <label class="row"><span>Basemap</span>
          <select id="basemap"><option value="sat">Satellite</option><option value="osm">Streets</option></select>
        </label>
        <p class="hint">Drag an overlay to move it. Footprint data © OpenStreetMap contributors.</p>
      </footer>
    </aside>
    <button id="panel-toggle" aria-label="Toggle panel">☰</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
